name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/faultline ./cmd/faultline-demo
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in reachable Go code
        run: make vuln

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fuzz the untrusted-input parsers, 30s per target
        run: make fuzz FUZZTIME=30s
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Unit and integration tests with the race detector
        run: make test-race

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # No -race: Windows runners lack cgo. lint-and-unit already covers Linux.
      - name: Unit tests
        if: runner.os != 'Linux'
        run: go test ./... -count=1
      - name: Integration tests
        run: go test -tags integration ./test/integration/ -count=1 -timeout 30m

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the dashboard
        run: make ui
      - name: npm audit (high and critical)
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Committed dashboard build matches the source
        run: git diff --exit-code -- internal/ui/dist
      - name: Build binaries
        run: make build
      - name: Playwright smoke test and accessibility audit (Chromium, Firefox, WebKit)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: make docker
      - name: Scan the faultline image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: faultline:0.1.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Scan the faultline-demo image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: faultline-demo:0.1.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Compose example
        env:
          FAULTLINE_TOKEN: ci-compose-control-token-0123456789
          FAULTLINE_ADMIN_TOKEN: ci-compose-admin-token-0123456789
        run: |
          docker compose -f examples/docker-compose.yaml up --build -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7700/healthz && break; sleep 1; done
          docker run --rm --network host -e FAULTLINE_TOKEN -v "$PWD/examples:/examples:ro" faultline:0.1.0 \
            run /examples/experiments/01-inventory-flaky.yaml --fail-on-breach
          docker compose -f examples/docker-compose.yaml down -v
