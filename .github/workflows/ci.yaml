name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/faultline ./cmd/faultline-demo
          done

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Unit and integration tests with the race detector
        run: make test-race

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags integration ./test/integration/ -count=1 -timeout 30m

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the dashboard
        run: make ui
      - name: Committed dashboard build matches the source
        run: git diff --exit-code -- internal/ui/dist
      - name: Build binaries
        run: make build
      - name: Playwright smoke test and accessibility audit (Chromium, Firefox, WebKit)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: make docker
      - name: Compose example
        env:
          FAULTLINE_TOKEN: ci-compose-control-token-0123456789
          FAULTLINE_ADMIN_TOKEN: ci-compose-admin-token-0123456789
        run: |
          docker compose -f examples/docker-compose.yaml up --build -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7700/healthz && break; sleep 1; done
          docker run --rm --network host -e FAULTLINE_TOKEN -v "$PWD/examples:/examples:ro" faultline:0.1.0 \
            run /examples/experiments/01-inventory-flaky.yaml --fail-on-breach
          docker compose -f examples/docker-compose.yaml down -v
